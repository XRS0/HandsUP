syntax = "proto3";

package gen;

option go_package = "./gen";

service SummarizerService {
  rpc Summarize(SummarizeRequest) returns (SummarizeResponse);

  rpc StreamSummarize(stream StreamSummarizeRequest) returns (stream StreamSummarizeResponse);
}

message SummarizeRequest {
  string session_id = 1;
  string full_text = 2;
}

message SummarizeResponse {
  string summary = 1;
}

message StreamSummarizeRequest {
  string session_id = 1;
  string partial_text = 2;
}

message StreamSummarizeResponse {
  string session_id = 1;
  string updated_summary = 2;
}
