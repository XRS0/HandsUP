<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Whisper STT</title>
	<style>
		#output {
			font-family: sans-serif;
			font-size: 1.2em;
			margin-top: 1em;
		}

		.final {
			color: black;
		}
	</style>
</head>

<body>
	<h1>Speech Recognition</h1>
	<button id="start">Start</button>
	<div id="output"></div>

	<script>
		const output = document.getElementById('output');
		const startBtn = document.getElementById('start');

		startBtn.onclick = async () => {
			const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
			const audioContext = new AudioContext({ sampleRate: 16000 });

			await audioContext.audioWorklet.addModule('audio-processor.js');

			const socket = new WebSocket('ws://localhost:8000');
			socket.binaryType = 'arraybuffer';

			const source = audioContext.createMediaStreamSource(stream);
			const processorNode = new AudioWorkletNode(audioContext, 'audio-processor');

			processorNode.port.onmessage = (event) => {
				if (socket.readyState === WebSocket.OPEN) {
					socket.send(event.data);
				}
			};

			socket.onmessage = (event) => {
				const message = event.data.trim();
				if (!message) return;

				if (message.endsWith('.')) {
					const finalDiv = document.createElement('div');
					finalDiv.className = 'final';
					finalDiv.textContent = message;
					output.appendChild(finalDiv);
					if (partialSpan) {
						partialSpan.remove();
						partialSpan = null;
					}
				} else {
					if (!partialSpan) {
						partialSpan = document.createElement('div');
						partialSpan.className = 'partial';
						output.appendChild(partialSpan);
					}
					partialSpan.textContent = message;
				}
				output.scrollTop = output.scrollHeight;
			};

			source.connect(processorNode).connect(audioContext.destination);
		};

	</script>
</body>

</html>
